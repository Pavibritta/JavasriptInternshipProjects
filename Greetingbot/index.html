<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greeting Bot</title>

    <link rel="stylesheet" href="./dist/output.css" />
    <link
      rel="icon"
      href="https://static.vecteezy.com/system/resources/previews/010/404/941/non_2x/human-greeting-line-icon-illustration-vector.jpg"
    />
  </head>

  <body class="bg-gray-900">
    <div class="flex items-center justify-center min-h-screen">
      <div
        class="w-full max-w-md bg-white rounded-xl shadow-2xl p-6 input-container"
      >
        <!-- Title -->
        <h1 class="text-2xl font-semibold text-center text-gray-800">
          Greeting Bot
        </h1>

        <!-- Input -->
        <div class="mt-6">
          <input
            type="text"
            name="name"
            id="name-input"
            placeholder="Your name"
            class="w-full rounded-lg border border-gray-300 px-4 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <small id="error" class="block text-red-500"></small>
        </div>

        <!-- Button -->
        <button
          id="submit-btn"
          class="w-full mt-5 bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition duration-200"
        >
          GREET
        </button>
      </div>
    </div>
    <!-- Card -->

    <script src="./script.js"></script>
  </body>
</html>
