  <body class="bg-gray-700">
    <div
      class="bg-gray-800 flex flex-col justify-center items-center p-10 w-full max-w-xl mx-auto rounded-lg shadow mt-20 input-container"
    >
      <h1 class="text-lg text-blue-300 text-center font-bold mb-5">
        Format Your Text
      </h1>
      <textarea
        class="bg-white text-black w-lg rounded shadow focus:outline-none focus:ring-2 focus:ring-blue-500 h-30 p-3 text-input"

      <span class="text-red-500 errormsg"></span>
      <button
        class="bg-blue-300 mt-3 text-white text-lg p-3 font-bold rounded cursor-pointer submit-btn"
      >
        Submit
      </button>
