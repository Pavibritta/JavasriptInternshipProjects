<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background Colour Switcher</title>
    <link rel="stylesheet" href="./dist/output.css" />
    <link
      rel="icon"
      href="https://media.istockphoto.com/id/2112037916/vector/pipette-color-picker-color-wheel.jpg?s=612x612&w=0&k=20&c=CETd-swGtyvikTMtWBxlvMLk1HnrIembJB7WpNqYsVk="
    />
  </head>
  <body class="bg-gray-100">
    <!-- <h1 class="text-xl text-green-600 text-center mt-10">GREETING BOT</h1> -->
    <div class="flex justify-center">
      <div
        class="w-full rounded max-w-4xl mt-10 shadow bg-white flex flex-col justify-center"
      >
        <div class="flex justify-center gap-2 p-3 flex-wrap">
          <button
            type="submit"
            class="rounded py-1 px-10 mx-auto my-2 bg-blue-600 text-white hover:bg-blue-800 font-medium cursor-pointer text-sm"
            id="change-btn"
          >
            Change Color
          </button>
          <button
            type="submit"
            class="rounded py-1 px-10 mx-auto my-2 bg-red-600 text-white hover:bg-red-800 font-medium cursor-pointer text-md"
            id="red-btn"
          >
            Red
          </button>
          <button
            type="submit"
            class="rounded py-1 px-10 mx-auto my-2 bg-green-600 text-white hover:bg-green-800 font-medium cursor-pointer text-md"
            id="green-btn"
          >
            Green
          </button>
          <button
            type="submit"
            class="rounded py-1 px-10 mx-auto my-2 bg-yellow-600 text-white hover:bg-yellow-800 font-medium cursor-pointer text-md"
            id="yellow-btn"
          >
            Yellow
          </button>
          <button
            type="submit"
            class="rounded py-1 px-10 mx-auto my-2 bg-gray-600 text-white hover:bg-gray-800 font-medium cursor-pointer text-md"
            id="black-btn"
          >
            Black
          </button>
          <button
            type="submit"
            class="rounded py-1 px-10 mx-auto my-2 bg-blue-600 text-white hover:bg-blue-800 font-medium cursor-pointer text-md"
            id="blue-btn"
          >
            Blue
          </button>
        </div>
      </div>
    </div>
  </body>
  <script src="./script.js"></script>
</html>
