<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background Colour Switcher</title>
    <link rel="stylesheet" href="./dist/output.css" />
    <link
      rel="icon"
      href="https://media.istockphoto.com/id/2112037916/vector/pipette-color-picker-color-wheel.jpg?s=612x612&w=0&k=20&c=CETd-swGtyvikTMtWBxlvMLk1HnrIembJB7WpNqYsVk="
    />
  </head>
  <body class="bg-gray-100">
    <!-- <h1 class="text-xl text-green-600 text-center mt-10">GREETING BOT</h1> -->
    <div class="flex justify-center">
      <div
        class="w-full rounded md:w-lg mt-10 shadow bg-white flex flex-col justify-center"
      >
        <input
          type="text"
          name="name"
          id="name-input"
          placeholder="Enter Your Name"
          class="border border-gray-300 shadow-sm rounded px-3 py-2 focus:outline-none focus:ring focus:ring-blue-500 mt-5 mx-auto min-w-10 md:w-sm"
        />
        <small class="text-center text-red-600" id="error"></small>
        <div class="flex justify-center gap-2 p-3">
          <!-- <button
            type="submit"
            class="rounded py-2 px-3 mx-auto my-2 bg-blue-600 text-white hover:bg-blue-800 font-medium cursor-pointer text-md"
            id="submit-btn"
          >
            GREET
          </button> -->
          <button
            type="submit"
            class="rounded py-2 px-3 mx-auto my-2 bg-blue-600 text-white hover:bg-blue-800 font-medium cursor-pointer text-sm"
            id="change-btn"
          >
            Change Random Color
          </button>
          <button
            type="submit"
            class="rounded py-2 px-3 mx-auto my-2 bg-red-600 text-white hover:bg-red-800 font-medium cursor-pointer text-md"
            id="red-btn"
          >
            Red Color
          </button>
          <button
            type="submit"
            class="rounded py-2 px-3 mx-auto my-2 bg-green-600 text-white hover:bg-green-800 font-medium cursor-pointer text-md"
            id="green-btn"
          >
            Green Color
          </button>
          <button
            type="submit"
            class="rounded py-2 px-3 mx-auto my-2 bg-yellow-600 text-white hover:bg-yellow-800 font-medium cursor-pointer text-md"
            id="yellow-btn"
          >
            Yellow Color
          </button>
          <button
            type="submit"
            class="rounded py-2 px-3 mx-auto my-2 bg-gray-600 text-white hover:bg-gray-800 font-medium cursor-pointer text-md"
            id="black-btn"
          >
            Black Color
          </button>
          <button
            type="submit"
            class="rounded py-2 px-3 mx-auto my-2 bg-blue-600 text-white hover:bg-blue-800 font-medium cursor-pointer text-md"
            id="blue-btn"
          >
            Blue Color
          </button>
        </div>
      </div>
    </div>
  </body>
  <script src="./script.js"></script>
</html>
